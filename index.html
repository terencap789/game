<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrapper">
    <section class="game-card">
      <header class="game-header">
        <div>
          <p class="eyebrow">ARCADE</p>
          <h1>🐍 Snake</h1>
        </div>
        <div class="scores">
          <div class="score-box">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="score-box">
            <span>Record</span>
            <strong id="highScore">0</strong>
          </div>
        </div>
      </header>

      <div class="canvas-container">
        <canvas id="gameCanvas" width="600" height="600" aria-label="Jeu Snake"></canvas>
        <div id="overlay" class="overlay">
          <div class="overlay-content">
            <div id="overlayIcon" class="overlay-icon">🐍</div>
            <h2 id="overlayTitle">Snake</h2>
            <p id="overlayText">Utilise les flèches du clavier pour commencer.</p>
            <button id="startButton">Jouer</button>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="control empty" aria-hidden="true"></button>
        <button class="control" data-direction="up" aria-label="Haut">▲</button>
        <button class="control empty" aria-hidden="true"></button>
        <button class="control" data-direction="left" aria-label="Gauche">◀</button>
        <button class="control" data-direction="down" aria-label="Bas">▼</button>
        <button class="control" data-direction="right" aria-label="Droite">▶</button>
      </div>

      <footer>
        <span>Flèches / WASD pour jouer</span>
        <span>Échap : pause</span>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
